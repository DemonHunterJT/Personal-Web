<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jasmine Tse — Selected Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== TOP NAV ===================== -->
<nav class="nav">
  <a class="nav-brand" href="index.html">Jasmine Tse</a>
  <div class="nav-links">
    <a href="index.html" class="active" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="publications.html">Publications</a>
    <a href="design.html">Design</a>
    <a href="modeling.html">3D Modeling</a>
    <a href="photography.html">Photography</a>
  </div>
</nav>

<!-- ===================== HOME ===================== -->
<main class="stage" id="home">

  <header class="site-head">
    <span>Selected Works · 2022—2026</span>
  </header>

  <div class="console">

    <!-- Turntable (click to open the profile) -->
    <div class="turntable" id="turntable" role="button" tabindex="0" aria-label="Open personal profile">
      <div class="platter" id="platter">
        <div class="disc" id="disc">
          <div class="disc-label" id="discLabel"></div>
        </div>
      </div>
      <div class="spindle"></div>

      <div class="tonearm" id="tonearm">
        <div class="arm-bar"></div>
        <div class="headshell"></div>
      </div>
      <div class="pivot-base"></div>
      <div class="pivot-cap"></div>

      <span class="tt-hint">Profile ↗</span>
    </div>

    <!-- Shelf -->
    <div class="shelf">
      <div class="shelf-items" id="shelf"></div>
      <div class="shelf-caption">Select a record</div>
    </div>

  </div>

  <footer class="site-foot">
    <span>Canton, CN</span>
    <span></span>
  </footer>

</main>

<script>
/* ============================================================
   RECORDS — 在这里修改唱片分类、颜色与跳转文件
   ============================================================ */
const RECORDS = [
  { id:'publications', num:'01', title:'Publications', color:'#3c4c46', text:'#ece9e1', href:'publications.html' },
  { id:'design',       num:'02', title:'Design',       color:'#a3583f', text:'#f5f0e7', href:'design.html' },
  { id:'modeling',     num:'03', title:'3D Modeling',  color:'#45566a', text:'#e9ecf1', href:'modeling.html' },
  { id:'photography',  num:'04', title:'Photography',  color:'#6d6659', text:'#f1ede5', href:'photography.html' }
];

const homeEl   = document.getElementById('home');
const shelfEl  = document.getElementById('shelf');
const platter  = document.getElementById('platter');
const disc     = document.getElementById('disc');
const discLabel= document.getElementById('discLabel');
const tonearm  = document.getElementById('tonearm');
const turntable= document.getElementById('turntable');

const ARM_REST = -13;   /* 唱臂静止角度 */
const ARM_PLAY = 62;    /* 唱臂播放角度 */

let busy = false;

/* ============================================================
   BUILD SHELF
   ============================================================ */
RECORDS.forEach(rec => {
  const btn = document.createElement('button');
  btn.className = 'sleeve';
  btn.type = 'button';
  btn.style.setProperty('--c', rec.color);
  btn.style.setProperty('--t', rec.text);
  btn.setAttribute('aria-label', 'Play ' + rec.title);
  btn.innerHTML = `
    <span class="peek"></span>
    <span class="cover">
      <span class="num">${rec.num}</span>
      <span class="name">${rec.title}</span>
    </span>`;
  btn.addEventListener('click', () => playRecord(rec, btn));
  shelfEl.appendChild(btn);
});

/* ============================================================
   TURNTABLE → PROFILE
   ============================================================ */
function openProfile(){
  if (busy) return;
  busy = true;
  homeEl.classList.add('hidden');
  setTimeout(() => { window.location.href = 'about.html'; }, 560);
}

turntable.addEventListener('click', openProfile);
turntable.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    openProfile();
  }
});

/* ============================================================
   PLAY SEQUENCE → 动画结束后跳转到独立页面
   ============================================================ */
function playRecord(rec, btn){
  if (busy) return;
  busy = true;

  const peek = btn.querySelector('.peek');
  const from = peek.getBoundingClientRect();
  const to   = platter.getBoundingClientRect();

  /* ---- flying vinyl ---- */
  const flyer = document.createElement('div');
  flyer.className = 'flyer';

  const label = document.createElement('span');
  label.className = 'flyer-label';
  label.style.background = rec.color;
  flyer.appendChild(label);
  document.body.appendChild(flyer);

  const s1  = from.width;
  const cx1 = from.left + s1 / 2;
  const cy1 = from.top  + s1 / 2;

  const s2  = to.width * 0.96;
  const cx2 = to.left + to.width  / 2;
  const cy2 = to.top  + to.height / 2;

  flyer.style.width  = s1 + 'px';
  flyer.style.height = s1 + 'px';
  flyer.style.left   = (cx1 - s1 / 2) + 'px';
  flyer.style.top    = (cy1 - s1 / 2) + 'px';

  /* force reflow so the transition fires */
  void flyer.offsetWidth;

  requestAnimationFrame(() => {
    flyer.style.transform =
      `translate(${cx2 - cx1}px, ${cy2 - cy1}px) scale(${s2 / s1}) rotate(540deg)`;
  });

  /* ---- tonearm swings in ---- */
  setTimeout(() => {
    tonearm.style.transform = `rotate(${ARM_PLAY}deg)`;
  }, 340);

  /* ---- record lands ---- */
  setTimeout(() => {
    flyer.remove();
    discLabel.style.background = rec.color;
    disc.classList.add('on');
    platter.classList.add('spinning');
  }, 990);

  /* ---- fade out, then navigate ---- */
  setTimeout(() => {
    homeEl.classList.add('hidden');
  }, 1420);

  setTimeout(() => {
    window.location.href = rec.href;
  }, 1820);
}
</script>
</body>
</html>
